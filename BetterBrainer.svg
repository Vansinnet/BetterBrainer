    <path d="M512 405v58M512 561v58M405 512h58M561 512h58" stroke-width="10"/>
  </g>
  <circle cx="512" cy="512" r="16" fill="#f1ffb0" filter="url(#glow)"/>

  <g aria-label="BetterBrainer">
    <path d="M265 796h494" stroke="#111617" stroke-width="70" stroke-linecap="round" opacity="0.9"/>
    <text x="512" y="816" text-anchor="middle" fill="#d8dec8" font-family="Bahnschrift, Rajdhani, sans-serif" font-size="58" font-weight="700" letter-spacing="4">BETTERBRAINER</text>
    <path d="M314 837h396" stroke="#a9ba70" stroke-width="5"/>
