    <path d="M570 361c58-12 88 29 77 73 43 4 61 48 38 80M593 437c-45 14-45 67-11 87 29 17 30 59 8 83M659 563c-27-22-65-10-78 18M652 429c25-13 52-6 69 12"/>
  </g>

  <g fill="none" stroke="#d5e882" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M304 596h52l32-35M720 596h-52l-32-35"/>
    <path d="M341 373h54l29 29M683 373h-54l-29 29"/>
    <path d="M390 673v-40l36-35M634 673v-40l-36-35"/>
