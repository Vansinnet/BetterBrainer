    <path d="M221 724l51 78 55-35-50-79z"/>
    <path d="M803 724l-51 78-55-35 50-79z"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M500 327c-28-49-105-54-141-12-46-5-82 37-72 81-43 26-49 86-16 121-28 47 3 107 54 116 9 54 75 79 118 44 17 14 36 22 57 24z" fill="url(#brain)" stroke="#d2dbb0" stroke-width="13" stroke-linejoin="round"/>
    <path d="M524 327c28-49 105-54 141-12 46-5 82 37 72 81 43 26 49 86 16 121 28 47-3 107-54 116-9 54-75 79-118 44-17 14-36 22-57 24z" fill="url(#brain)" stroke="#d2dbb0" stroke-width="13" stroke-linejoin="round"/>
    <path d="M512 326v380" stroke="#293124" stroke-width="15"/>
