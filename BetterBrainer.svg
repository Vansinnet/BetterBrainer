<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">BetterBrainer emblem</title>
  <desc id="description">A stylized cybernetic brain inside an auspex targeting reticle.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#263237"/>
      <stop offset="0.58" stop-color="#11181b"/>
      <stop offset="1" stop-color="#080b0d"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d0bd"/>
      <stop offset="0.48" stop-color="#767d78"/>
      <stop offset="1" stop-color="#353d3d"/>
    </linearGradient>
    <linearGradient id="brain" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#d8e6b5"/>
      <stop offset="0.52" stop-color="#9fb36f"/>
      <stop offset="1" stop-color="#53633d"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <clipPath id="disc"><circle cx="512" cy="512" r="462"/></clipPath>
  </defs>

  <circle cx="512" cy="512" r="492" fill="#070a0b"/>
  <circle cx="512" cy="512" r="470" fill="url(#background)" stroke="#788074" stroke-width="10"/>

  <g clip-path="url(#disc)" opacity="0.18" stroke="#90a06c" stroke-width="3">
    <path d="M-20 186H1044M-20 326H1044M-20 698H1044M-20 838H1044"/>
    <path d="M186-20V1044M326-20V1044M698-20V1044M838-20V1044"/>
    <path d="M54 884L884 54M140 1010L1010 140"/>
  </g>

  <g fill="none" stroke="url(#steel)">
    <circle cx="512" cy="512" r="396" stroke-width="17" stroke-dasharray="118 32 18 32"/>
    <circle cx="512" cy="512" r="345" stroke-width="5" opacity="0.7" stroke-dasharray="8 16"/>
  </g>

  <g stroke="#b6c77a" stroke-width="18" stroke-linecap="square" filter="url(#glow)">
