# Builds, validates and publishes a release, then uploads it to Nexus Mods.
#
# Runs when a version tag (e.g. v1.2.0) is pushed, or by hand from the
# Actions tab ("Run workflow") for a tag that already exists. A plain
# lightweight tag is enough: git tag v1.2.0 && git push origin v1.2.0.
#
# The release notes come from CHANGELOG.md: tag v1.2.0 uses the section under
# "## [1.2.0]" (anything after the version on that line, like a date, is
# ignored). Write that section before tagging; the workflow fails if it is
# missing or empty. The same section becomes the Nexus changelog, one line per
# entry with Markdown removed.
#
# vX.Y.Z-suffix is a prerelease and stays on GitHub only. A release that
# already exists is refreshed (notes and ZIP), so re-running fixes a release.
# A manual run only uploads to Nexus when "nexus" is ticked, and the upload is
# skipped if that version is already on Nexus.
#
# Repository secret NEXUSMODS_APIKEY holds the personal Nexus API key.
# Optional: give the "nexus" environment a required reviewer to approve each
# upload.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v1.2.0)
        required: true
        type: string
      nexus:
        description: Also upload it to Nexus Mods as a new version
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  MOD_NAME: "BetterBrainer"
  NEXUS_MOD_ID: "1282"
  CHANGELOG: CHANGELOG.md

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      changelog: ${{ steps.notes.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Check tag
        id: check
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "Tag must be vX.Y.Z or vX.Y.Z-suffix: $TAG" >&2; exit 1; }
          prerelease=false
          [ -z "${BASH_REMATCH[2]}" ] || prerelease=true

          git fetch --no-tags origin main
          commit="$(git rev-list -n 1 "refs/tags/$TAG")"
          git merge-base --is-ancestor "$commit" origin/main \
            || { echo "$TAG must point at a commit on main." >&2; exit 1; }

          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "prerelease=$prerelease"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      # notes.md is the changelog section as written, for the GitHub release.
      # Nexus shows its changelog one plain-text line per entry, so its copy
      # joins each wrapped bullet back onto one line, drops the "###" group
      # headings and removes list markers, bold, code and link markup.
      - name: Release notes from changelog
        id: notes
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          [ -f "$CHANGELOG" ] || { echo "$CHANGELOG is missing." >&2; exit 1; }
          awk -v heading="## [$VERSION]" '
            /^## / { if (found) exit; found = index($0, heading) == 1; next }
            found { lines[++n] = $0 }
            END {
              first = 1
              while (first <= n && lines[first] ~ /^[[:space:]]*$/) first++
              while (n >= first && lines[n] ~ /^[[:space:]]*$/) n--
              for (i = first; i <= n; i++) print lines[i]
            }' "$CHANGELOG" > notes.md
          [ -s notes.md ] || { echo "No non-empty '## [$VERSION]' section in $CHANGELOG." >&2; exit 1; }
          cat notes.md

          awk '
            /^[[:space:]]*$/ || /^[[:space:]]*#/ { next }
            { text = $0; sub(/^[[:space:]]+/, "", text) }
            n == 0 || text ~ /^[-*+][[:space:]]/ { entries[++n] = text; next }
            { entries[n] = entries[n] " " text }
            END { for (i = 1; i <= n; i++) print entries[i] }' notes.md \
            | sed -E 's/^[-*+][[:space:]]+//; s/\*\*([^*]+)\*\*/\1/g; s/__([^_]+)__/\1/g; s/`([^`]+)`/\1/g; s/\[([^]]+)\]\([^)]+\)/\1/g' \
            > changelog.txt
          [ -s changelog.txt ] || { echo "The '## [$VERSION]' section has no entries." >&2; exit 1; }

          delimiter="CHANGELOG_$(openssl rand -hex 16)"
          {
            echo "changelog<<$delimiter"
            cat changelog.txt
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Install LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit > /dev/null

      - name: Build and inspect the release ZIP
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - "$MOD_NAME" dist <<'PY'
          import hashlib, json, os, re, subprocess, sys, zipfile
          mod, out = sys.argv[1], sys.argv[2]

          def fail(message):
              sys.exit("Release check failed: " + message)

          manifests = [f for f in os.listdir(".") if f.endswith(".mod") and os.path.isfile(f)]
          if manifests != [mod + ".mod"]:
              fail(f"expected exactly one top-level {mod}.mod, found {manifests}")
          text = open(mod + ".mod", encoding="utf-8-sig").read()
          if not re.search(r'new_mod\s*\(\s*["\']([^"\']+)["\']', text):
              fail("no literal ModID in the .mod file")
          paths = re.findall(r'mod_(?:script|data|localization)\s*=\s*["\']([^"\']+)["\']', text)
          if len(paths) != 3:
              fail("the .mod file must declare literal mod_script, mod_data and mod_localization")
          for path in paths:
              if not path.startswith(mod + "/") or not os.path.isfile(path[len(mod) + 1:] + ".lua"):
                  fail(f"DMF path {path} does not resolve inside {mod}/")

          forbidden_dirs = {"analysis", "resource", "resources", "installer", "bootstrap", "bin", "obj",
                            "tools", "tests", "types", ".git", ".github", ".opencode", "LuaExec"}
          forbidden_ext = {".zip", ".7z", ".rar", ".log", ".tmp", ".bak", ".pyc", ".luac", ".pdb", ".user",
                           ".suo", ".env", ".pem", ".key", ".pfx", ".p12"}
          forbidden_names = {"luac.out", "desktop.ini", "Thumbs.db", ".env", "secrets.json", "credentials.json"}
          direct = os.path.isfile("release-layout.json")
          files = []

          def add(source, destination):
              if os.path.isabs(source) or ".." in re.split(r"[\\/]", source) or not destination.startswith(mod + "/"):
                  fail(f"unsafe mapping {source} -> {destination}")
              if not os.path.exists(source) or os.path.islink(source):
                  fail(f"missing source or symlink: {source}")
              if os.path.isdir(source):
                  found = []
                  for root, dirs, names in os.walk(source):
                      if any(os.path.islink(os.path.join(root, d)) for d in dirs):
                          fail(f"symlink under {source}")
                      found += [os.path.join(root, n) for n in names]
                  items = [(f, destination + "/" + os.path.relpath(f, source).replace(os.sep, "/")) for f in sorted(found)]
              else:
                  items = [(source, destination)]
              if not items:
                  fail(f"empty source: {source}")
              for path, entry in items:
                  rel = os.path.normpath(path).replace(os.sep, "/")
                  library = direct and rel in ("bin/reforge.dll", "bin/REFORGE_NOTICES.txt")
                  if set(rel.split("/")) & forbidden_dirs and not library:
                      fail(f"development path in the release: {rel}")
                  name = os.path.basename(rel)
                  if (os.path.splitext(name)[1] in forbidden_ext or name in forbidden_names
                          or re.search(r"(?i)secret|credential", name) or os.path.islink(path)):
                      fail(f"forbidden file in the release: {rel}")
                  files.append((rel, entry))

          if direct:
              layout = json.load(open("release-layout.json", encoding="utf-8-sig"))
              if layout.get("schemaVersion") != 1 or layout.get("profile") != "direct" or "installer" in layout:
                  fail("release-layout.json must be schemaVersion 1, profile direct, no installer")
              for group in ("payload", "documentation", "licenses"):
                  mappings = layout["package"].get(group) or []
                  if not mappings:
                      fail(f"release-layout.json needs at least one {group} mapping")
                  for mapping in mappings:
                      add(mapping["source"], mapping["destination"])
          else:
              if os.path.isdir("payload") or os.path.isdir("bin"):
                  fail("payload/ or bin/ needs a reviewed release-layout.json")
              for root, _, names in os.walk("scripts"):
                  for name in names:
                      if not name.endswith(".lua"):
                          fail(f"non-Lua file under scripts/ needs release-layout.json: {os.path.join(root, name)}")
              add(mod + ".mod", f"{mod}/{mod}.mod")
              add("scripts", f"{mod}/scripts")

          entries = [entry for _, entry in files]
          if len({e.lower() for e in entries}) != len(entries):
              fail("duplicate destination")
          if f"{mod}/{mod}.mod" not in entries:
              fail("the .mod file is not in the payload")
          runtime = sorted(rel for rel, _ in files if rel.endswith((".lua", ".mod")))
          if not runtime:
              fail("no runtime Lua or .mod files")
          for rel in runtime:
              check = 'local f, e = loadfile(os.getenv("LUA_FILE")) if not f then io.stderr:write(e) os.exit(1) end'
              result = subprocess.run(["luajit", "-e", check], env=dict(os.environ, LUA_FILE=rel),
                                      capture_output=True, text=True)
              if result.returncode:
                  fail(f"LuaJIT load failed for {rel}: {result.stderr.strip()}")
          print(f"LuaJIT load passed for {len(runtime)} runtime file(s).")

          def sha(path):
              return hashlib.sha256(open(path, "rb").read()).hexdigest().upper()

          archive = os.path.join(out, mod + ".zip")
          with zipfile.ZipFile(archive, "w") as z:
              for rel, entry in sorted(files, key=lambda item: item[1].lower()):
                  info = zipfile.ZipInfo(entry, date_time=(2000, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  z.writestr(info, open(rel, "rb").read(), compresslevel=9)
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None:
                  fail("CRC check failed")
              by_entry = dict((entry, rel) for rel, entry in files)
              for name in z.namelist():
                  if "\\" in name or not name.startswith(mod + "/"):
                      fail(f"unexpected archive entry {name}")
                  if hashlib.sha256(z.read(name)).digest() != hashlib.sha256(open(by_entry[name], "rb").read()).digest():
                      fail(f"archive entry differs from its source: {name}")
              print(f"{len(z.namelist())} archive entries:")
              print("\n".join(z.namelist()))
          print("SHA-256", sha(archive))
          PY

      - name: Publish the GitHub release
        env:
          VERSION: ${{ steps.check.outputs.version }}
          PRERELEASE: ${{ steps.check.outputs.prerelease }}
          COMMIT: ${{ steps.check.outputs.commit }}
        run: |
          set -euo pipefail
          hash="$(sha256sum "dist/$MOD_NAME.zip" | cut -d' ' -f1 | tr 'a-f' 'A-F')"
          {
            cat notes.md
            echo
            echo "## Installation"
            echo
            echo "Download **$MOD_NAME.zip** below and extract the \`$MOD_NAME/\` folder into your DMF mods directory. Add \`$MOD_NAME\` to \`mod_load_order.txt\`. Do not enable BetterBrainer and NoBrainer together."
            echo
            echo "Use the installation ZIP rather than GitHub's automatically generated source archives."
            echo
            echo "SHA-256 ($MOD_NAME.zip): $hash"
            echo
            echo "Source commit: $COMMIT"
          } > body.md
          title="$MOD_NAME $VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file body.md
            gh release upload "$TAG" "dist/$MOD_NAME.zip#$MOD_NAME.zip" --repo "$GITHUB_REPOSITORY" --clobber
          else
            flag=--latest
            [ "$PRERELEASE" = false ] || flag=--prerelease
            gh release create "$TAG" "dist/$MOD_NAME.zip#$MOD_NAME.zip" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$title" --notes-file body.md "$flag"
          fi
          echo "Published $TAG with $MOD_NAME.zip SHA-256 $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: dist/${{ env.MOD_NAME }}.zip
          if-no-files-found: error

  # Prereleases stay on GitHub. A manual run uploads only when "nexus" is ticked.
  nexus:
    needs: release
    if: ${{ needs.release.outputs.prerelease == 'false' && (github.event_name == 'push' || inputs.nexus) }}
    runs-on: ubuntu-latest
    environment: nexus
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: dist

      - name: Name the upload
        id: zip
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          upload_name="${MOD_NAME// /-}-$VERSION.zip"
          cp "dist/$MOD_NAME.zip" "$upload_name"
          echo "filename=$upload_name" >> "$GITHUB_OUTPUT"

      - name: Resolve Nexus ids
        id: nexus
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_APIKEY }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          : "${NEXUS_API_KEY:?Set repository secret NEXUSMODS_APIKEY}"

          query="$(jq -nc --arg m "$NEXUS_MOD_ID" \
            '{query: ("query{modFiles(modId:\"" + $m + "\",gameId:\"4943\"){category groupId version name}}")}')"
          curl -sSf -H "apikey: $NEXUS_API_KEY" -H "content-type: application/json" \
            -X POST "https://api.nexusmods.com/v2/graphql" -d "$query" > files.json
          jq -e '(.errors // []) | length == 0' files.json > /dev/null \
            || { jq '.errors' files.json >&2; exit 1; }

          if jq -e --arg v "$VERSION" '[.data.modFiles[] | select(.version == $v)] | length > 0' files.json > /dev/null; then
            echo "::notice::$MOD_NAME $VERSION is already on Nexus; nothing to upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The current file is the single MAIN entry; "primary" can point at an archived file.
          jq -c '[.data.modFiles[] | select(.category == "MAIN")] | unique_by(.groupId)' files.json > main.json
          [ "$(jq length main.json)" -eq 1 ] \
            || { echo "Expected exactly one MAIN file group on Nexus:" >&2; jq . main.json >&2; exit 1; }
          file_id="$(jq -r '.[0].groupId' main.json)"
          file_name="$(jq -r '.[0].name' main.json)"

          mod_id="$(curl -sSf -H "apikey: $NEXUS_API_KEY" \
            "https://api.nexusmods.com/v3/games/warhammer40kdarktide/mods/$NEXUS_MOD_ID" | jq -r '.data.id')"
          [ -n "$mod_id" ] && [ "$mod_id" != "null" ] || { echo "No global Nexus mod id." >&2; exit 1; }

          echo "Nexus file group $file_id ($file_name), global mod id $mod_id"
          {
            echo "skip=false"
            echo "file_id=$file_id"
            echo "file_name=$file_name"
            echo "mod_id=$mod_id"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        if: ${{ steps.nexus.outputs.skip != 'true' }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_APIKEY }}
          file_id: ${{ steps.nexus.outputs.file_id }}
          mod_id: ${{ steps.nexus.outputs.mod_id }}
          filename: ${{ steps.zip.outputs.filename }}
          version: ${{ needs.release.outputs.version }}
          display_name: ${{ steps.nexus.outputs.file_name }}
          category: main
          description: ${{ env.MOD_NAME }} ${{ needs.release.outputs.version }}. Extract into Darktide's mods folder; requires Darktide Mod Framework.
          changelog: ${{ needs.release.outputs.changelog }}
          update_mod_version: true
